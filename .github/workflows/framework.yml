name: framework

on:
  pull_request:
    paths:
      - 'scripts/build-rnp-framework.sh'
      - 'Vendor/SOURCES.md'
      - '.github/workflows/framework.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  RNP_REF: v0.18.1

jobs:
  build-framework:
    runs-on: macos-14
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Install OpenSSL + cmake
      run: brew install openssl@3 json-c cmake pkg-config

    - name: Build RNPFramework.xcframework
      run: ./scripts/build-rnp-framework.sh
      env:
        OPENSSL_PREFIX: $(brew --prefix openssl@3)

    - name: Inspect xcframework
      run: |
        set -e
        FW="Vendor/RNPFramework.xcframework"
        echo "=== Top-level ==="
        ls -la "$FW" | head -20
        echo ""
        echo "=== Architectures ==="
        for variant in "$FW"/*/; do
          [ -d "$variant" ] || continue
          echo "  $(basename "$variant"):"
          lipo -info "$variant"*/RNPFramework 2>/dev/null | sed 's/^/    /' || true
        done
        echo ""
        echo "=== Headers ==="
        find "$FW" -name '*.h' | head -10
        echo ""
        echo "=== Module map ==="
        find "$FW" -name '*.modulemap' | head -5

    - name: Verify Swift can import the framework
      run: |
        set -e
        mkdir -p /tmp/framework-test
        cat > /tmp/framework-test/main.swift <<'EOF'
        import Foundation
        import RNPFramework

        public func smokeTest() {
            let version = "framework imported"
            print(version)
        }
        EOF
        swiftc -emit-library -o /tmp/framework-test/libtest.dylib \
          -F Vendor/RNPFramework.xcframework/macos-arm64_x86_64 \
          /tmp/framework-test/main.swift
        test -f /tmp/framework-test/libtest.dylib && echo "OK: framework importable"
