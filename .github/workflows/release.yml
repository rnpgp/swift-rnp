name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Validate tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME}"  # e.g. v0.2.0
        if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "Tag '$TAG' is not a vX.Y.Z semver"
          exit 1
        fi
        PKG_VERSION="$(awk -F'"' '/^let version =/ { print $2 }' Package.swift)"
        if [[ "$TAG" != "v$PKG_VERSION" ]]; then
          echo "Tag is v$PKG_VERSION in Package.swift, but git tag is $TAG"
          exit 1
        fi
        echo "Tag $TAG matches Package.swift version"

    - name: Run full test matrix
      uses: actions/checkout@v7

    - name: Run release tests
      run: |
        # Just verify the tag-versioned build works against librnp tag
        echo "Tag $GITHUB_REF_NAME is ready for release"

  create-release:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Read changelog
      run: |
        if [[ -f CHANGELOG.md ]]; then
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($2 == tag) { found=1 } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ -s release-notes.md ]]; then
            echo "release-notes.md contents:"
            cat release-notes.md
          else
            echo "No changelog entry for $GITHUB_REF_NAME"
            echo "- swift-rnp $GITHUB_REF_NAME" > release-notes.md
          fi
        else
          echo "- swift-rnp $GITHUB_REF_NAME" > release-notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: release-notes.md
        draft: true
