name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.3 (with or without leading v)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # When the workflow_dispatch path pushes the tag, the resulting tag-push
    # event re-triggers this workflow. Skip that second run — the first run is
    # already creating the release.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"
            v="${v#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${v}' is not a valid x.y.z SemVer" >&2
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}"     >> "$GITHUB_OUTPUT"

      - name: Refuse to re-tag an existing version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "ERROR: tag ${{ steps.ver.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "swift-rnp ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
