name: test

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - id: matrix
      run: |
        if [ "${{ github.event.client_payload }}" != "" ]; then
          echo "matrix=[ '${{ github.event.client_payload.tag }}' ]" >> $GITHUB_OUTPUT
        else
          echo "matrix=[ 'v0.18.1', '' ]" >> $GITHUB_OUTPUT
        fi

  swift-test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        rnp: ${{ fromJson(needs.prepare.outputs.matrix) }}
        os: [ macos-14, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install librnp build deps
      run: |
        set -e
        if [[ "${{ matrix.os }}" == "macos-14" ]]; then
          brew install openssl@3 json-c cmake pkg-config
        else
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjson-c-dev libbz2-dev cmake pkg-config
        fi

    - name: Set up Swift (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.10"

    - name: Checkout rnp
      uses: actions/checkout@v7
      with:
        repository: rnpgp/rnp
        path: rnp
        submodules: true
        ref: ${{ matrix.rnp }}

    - name: Configure rnp (OpenSSL backend)
      run: |
        set -e
        if [[ "${{ matrix.os }}" == "macos-14" ]]; then
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          cmake -B rnp/build -DCRYPTO_BACKEND=openssl \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DBUILD_TESTING=OFF -DENABLE_DOC=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release rnp
        else
          cmake -B rnp/build -DCRYPTO_BACKEND=openssl \
            -DBUILD_TESTING=OFF -DENABLE_DOC=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release rnp
        fi

    - name: Build rnp
      run: cmake --build rnp/build --parallel

    - name: Install rnp
      run: sudo cmake --install rnp/build

    - name: Verify rnp installation
      run: |
        set -e
        echo "=== librnp version ==="
        rnp --version
        echo ""
        echo "=== linked libraries ==="
        otool -L /usr/local/lib/librnp*.dylib 2>/dev/null | head -3 \
          || ldd /usr/local/lib/librnp.so* 2>/dev/null | head -3
      env:
        LD_LIBRARY_PATH: /usr/local/lib
        DYLD_LIBRARY_PATH: /usr/local/lib

    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Build swift-rnp
      run: swift build
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Run library tests
      run: swift test
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        LD_LIBRARY_PATH: /usr/local/lib

    - name: Run RnpDemo smoke test
      run: swift run RnpDemo
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        LD_LIBRARY_PATH: /usr/local/lib
