name: test

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  RNP_REF: v0.18.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - id: matrix
      run: |
        if [ "${{ github.event.client_payload }}" != "" ]; then
          echo "matrix=[ '${{ github.event.client_payload.tag }}' ]" >> $GITHUB_OUTPUT
        else
          echo "matrix=[ 'v0.18.1', '' ]" >> $GITHUB_OUTPUT
        fi

  swift-test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        rnp: ${{ fromJson(needs.prepare.outputs.matrix) }}
        os: [ macos-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}
    steps:
    - name: Install librnp build deps
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew install botan json-c cmake
        else
          sudo apt-get update
          sudo apt-get install -y libbotan-3-dev libjson-c-dev cmake pkg-config
        fi

    - name: Set up Swift (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: swift-actions/setup-swift@v2

    - name: Checkout rnp
      uses: actions/checkout@v7
      with:
        repository: rnpgp/rnp
        path: rnp
        submodules: true
        ref: ${{ matrix.rnp }}

    - name: Configure rnp
      run: >
        cmake -B rnp/build -DCRYPTO_BACKEND=botan3 -DBUILD_TESTING=OFF
        -DENABLE_DOC=OFF -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release rnp

    - name: Build rnp
      run: cmake --build rnp/build --parallel

    - name: Install rnp
      run: sudo cmake --install rnp/build

    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Build swift-rnp
      run: swift build
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Run library tests
      run: swift test --skip-build
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Run RnpDemo smoke test
      run: swift run RnpDemo
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
