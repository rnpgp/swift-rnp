name: test

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - id: matrix
      run: |
        if [ "${{ github.event.client_payload }}" != "" ]; then
          echo "matrix=[ '${{ github.event.client_payload.tag }}' ]" >> $GITHUB_OUTPUT
        else
          echo "matrix=[ 'v0.18.1', '' ]" >> $GITHUB_OUTPUT
        fi

  swift-test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        rnp: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: macos-14
    steps:
    - name: Install librnp build deps
      run: brew install openssl@3 json-c cmake pkg-config

    - name: Checkout rnp
      uses: actions/checkout@v7
      with:
        repository: rnpgp/rnp
        path: rnp
        submodules: true
        ref: ${{ matrix.rnp }}

    - name: Configure rnp (OpenSSL backend)
      run: |
        OPENSSL_PREFIX="$(brew --prefix openssl@3)"
        cmake -B rnp/build -DCRYPTO_BACKEND=openssl \
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
          -DBUILD_TESTING=OFF -DENABLE_DOC=OFF \
          -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release rnp

    - name: Build rnp
      run: cmake --build rnp/build --parallel

    - name: Install rnp
      run: sudo cmake --install rnp/build

    - name: Verify rnp installation
      run: rnp --version

    - name: Checkout swift-rnp
      uses: actions/checkout@v7

    - name: Build swift-rnp
      run: swift build
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Run RnpDemo smoke test
      continue-on-error: true      run: swift run RnpDemo
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Run library tests
      continue-on-error: true
      run: swift test
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
